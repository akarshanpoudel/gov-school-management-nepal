{% extends 'base.html' %}

    <p class="mb-6 text-slate-600">Welcome back, <span class="font-semibold text-slate-800">{{ request.user.username }}</span>.</p>
    
    <div class="border-t border-slate-100 pt-4">
        <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Quick Actions</h3>
        <a href="{% url 'academics:export_iemis' %}" class="inline-block bg-slate-900 text-white px-5 py-2.5 rounded-md hover:bg-slate-800 text-sm font-medium transition shadow-sm">
