{% extends 'base.html' %}

{% block title %}Login - School Management System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-sm border border-slate-200 mt-10">
    <h1 class="text-xl font-bold text-slate-900 mb-4 text-center">System Login</h1>

    {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded mb-4">
            Invalid username or password. Please try again.
        </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="id_username" class="block text-xs font-semibold text-slate-700 mb-1">Username / Roll No</label>
            <input type="text" name="username" id="id_username" required class="w-full border border-slate-300 rounded p-2 text-xs focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
        <div>
            <label for="id_password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
            <input type="password" name="password" id="id_password" required class="w-full border border-slate-300 rounded p-2 text-xs focus:ring-2 focus:ring-slate-900 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded text-xs font-semibold transition">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
