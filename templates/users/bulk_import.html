{% extends 'base.html' %}

{% block title %}Bulk Student Import{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-sm border border-slate-200">
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
        <h1 class="text-xl font-bold text-slate-900">Bulk Student CSV Uploader</h1>
        <a href="{% url 'core:dashboard' %}" class="bg-slate-100 border border-slate-300 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded text-xs font-semibold transition">
            ← Dashboard
        </a>
    </div>

    <!-- Format Guide -->
    <div class="bg-slate-50 border border-slate-200 p-4 rounded mb-6 text-xs text-slate-700 space-y-2">
        <strong class="text-slate-900 block">Required CSV Header Format:</strong>
        <code class="block bg-white p-2 rounded border border-slate-300 font-mono">username,first_name,last_name,classroom</code>
        <p class="text-slate-500">Example row: <code>STU-1050,Aarav,Sharma,Grade 10</code></p>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label for="csv_file" class="block text-xs font-semibold text-slate-700 mb-2">Select CSV File</label>
            <input 
                type="file" 
                id="csv_file" 
                name="csv_file" 
                accept=".csv"
                required
                class="w-full border border-slate-300 rounded p-2 text-xs focus:ring-2 focus:ring-slate-900 focus:outline-none"
            >
        </div>
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded text-xs font-semibold shadow transition">
            Upload & Process Batch Import
        </button>
    </form>
</div>
{% endblock %}
