<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government School Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">
    <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-lg font-bold tracking-wide">Government School Management System</h1>
        {% if user.is_authenticated %}
            <span class="text-sm bg-slate-800 px-3 py-1 rounded">Logged in as: {{ user.username }}</span>
        {% endif %}
    </nav>
    <main class="p-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
